repos:
  - repo: builtin
    hooks:
      - id: check-added-large-files
        # The car connections are a single file of about 700 KB.
        args: [--maxkb=1024]
      - id: check-case-conflict
      - id: check-json
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]

  - repo: local
    hooks:
      - id: check
        name: check
        entry: bun run check
        language: system
        pass_filenames: false
