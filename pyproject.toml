[project]
name = "ferry-planner"
version = "0.1.0"
description = "BC Ferries sailing planner website server"
readme = "readme.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "beautifulsoup4~=4.15.0",
    "fastapi>=0.140.13,<0.142.0",
    "httpx~=0.28.1",
    "jinja2~=3.1.5",
    "pydantic-settings>=2.14.2,<2.16.0",
    "pydantic>=2.13.4,<3.0.0",
    "tzdata~=2026.3",
    "uvicorn[standard]~=0.52.0",
]

[dependency-groups]
dev = [
    "prek>=0.4.11,<0.6.0",
]

[build-system]
requires = ["uv_build>=0.12.0"]
build-backend = "uv_build"

[tool.ruff]
src = ["src"]
line-length = 119

[tool.ruff.lint]
select = ["ALL"]
ignore = ["A", "D1", "TD003"]
