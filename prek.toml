#:schema https://www.schemastore.org/prek.json

[[repos]]
repo = "builtin"
hooks = [
  {
    id = "check-added-large-files",
    args = ["--maxkb=1024"]
  },
  { id = "check-case-conflict" },
  { id = "check-json" },
  { id = "check-yaml" },
  { id = "end-of-file-fixer" },
  {
    id = "trailing-whitespace",
    args = ["--markdown-linebreak-ext=md"]
  }
]

[[repos]]
repo = "local"
hooks = [
  {
    id = "check",
    name = "check",
    entry = "bun run check",
    language = "system",
    pass_filenames = false
  }
]
